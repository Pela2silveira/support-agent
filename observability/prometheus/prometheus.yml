global:
  scrape_interval: 1m
  scrape_timeout: 30s
  evaluation_interval: 1m

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Host ICMP target(s) from configure.sh → file_sd/sss-pacs-icmp.yml
  - job_name: sss-pacs-icmp
    metrics_path: /probe
    params:
      module:
        - icmp
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/sss-pacs-icmp.yml
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Host DICOM TCP target(s) from configure.sh → file_sd/sss-pacs-dicom.yml
  - job_name: sss-pacs-dicom-tcp
    metrics_path: /probe
    params:
      module:
        - tcp_connect
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/sss-pacs-dicom.yml
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: sss-pacs-mwl
    scrape_interval: 1m
    static_configs:
      - targets:
          - dcm4chee-mwl:9100
        labels:
          location: central
          system: sss-pacs
          check: mwl

  - job_name: sss-fortigate
    scrape_interval: 1m
    scrape_timeout: 45s
    metrics_path: /probe
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/sss-fortigate.yml
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
        regex: '(?:.+)(?::\/\/)([^:]*).*'
      - target_label: __address__
        replacement: fortigate-exporter:9710
