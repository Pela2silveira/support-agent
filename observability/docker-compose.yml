services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:${GRAFANA_PORT:-3001}"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_VIEWERS_CAN_EDIT=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_HTTP_PORT=${GRAFANA_PORT:-3001}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    env_file:
      - .env
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/file_sd:/etc/prometheus/file_sd:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      - blackbox
      - dcm4chee-mwl
      - fortigate-exporter

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    cap_add:
      - NET_RAW

  dcm4chee-mwl:
    build:
      context: ./exporters/dcm4chee-mwl
      network: host
    container_name: dcm4chee-mwl
    restart: unless-stopped
    ports:
      - "9100:9100"
    env_file:
      - .env

  fortigate-exporter:
    image: quay.io/prometheuscommunity/fortigate-exporter:main-distroless
    container_name: fortigate-exporter
    restart: unless-stopped
    ports:
      - "9710:9710"
    volumes:
      - ./fortigate/fortigate-key.yaml:/config/fortigate-key.yaml:ro
    # -insecure: SSS FortiGate typically uses a private/self-signed cert
    command:
      - -auth-file=/config/fortigate-key.yaml
      - -listen=:9710
      - -insecure

volumes:
  prometheus_data:
  grafana_data:
