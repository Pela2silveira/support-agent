[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diagnostic-platform"
version = "0.1.0"
description = "Operational diagnostics and remediation framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
diag = "diag.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
